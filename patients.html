<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration</title>
</head>
<body>

<h2>Patient Registration</h2>
<label>Gender:</label>
<select>
    <option>Male</option>
    <option>Female</option>
    <option>Other</option>
</select><br><br>

<form>
    <label>Patient Name:</label>
    <input type="text" placeholder="Enter patient name"><br><br>

    <label>Age:</label>
    <input type="number" placeholder="Enter age"><br><br>

    <label>Phone:</label>
    <input type="text" placeholder="Enter phone number"><br><br>

    <button type="submit">Register Patient</button>
</form>

</body>
</html>
